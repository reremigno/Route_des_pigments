<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>La route des pigments — Siècle d'or hollandais</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#141210;color:#e8e4da;user-select:none}
#app{display:flex;flex-direction:column;height:100%}

header{display:flex;align-items:center;gap:18px;padding:11px 18px;background:#1c1916;border-bottom:1px solid #332e28;flex:0 0 auto}
header h1{font-size:22px;font-weight:600;margin:0;white-space:nowrap}
header h1 small{display:block;font-size:12.5px;font-weight:400;color:#8a8278;letter-spacing:.7px;text-transform:uppercase;margin-top:2px}
#prog{font-size:19px;color:#c8c0b2;background:#262119;padding:8px 18px;border-radius:26px;white-space:nowrap}
#prog b{color:#e8c547;font-size:22px}
.spacer{flex:1}
button{font:inherit;font-size:17px;color:#e8e4da;background:#2b2621;border:1px solid #433c33;border-radius:10px;padding:12px 20px;cursor:pointer;min-height:54px}
button:hover{background:#363029}
button:active{background:#413a31}
button.on{background:#8a6a14;border-color:#b8902a;color:#fff}
button.danger{border-color:#6b3030}

main{flex:1;display:flex;min-height:0}
#rail{flex:0 0 232px;background:#1c1916;border-right:1px solid #332e28;overflow-y:auto;padding:10px}
#rail h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#8a8278;margin:6px 0 10px 6px;font-weight:600}
.chip{display:flex;align-items:center;gap:12px;width:100%;padding:10px 11px;margin-bottom:7px;background:#252019;border:1px solid #39322a;border-radius:11px;cursor:pointer;min-height:64px;text-align:left}
.chip:hover{background:#2e2820}
.chip.sel{border-color:#e8c547;background:#3a3118;box-shadow:0 0 0 3px rgba(232,197,71,.3)}
.chip.done{opacity:.45}
.chip .sw{flex:0 0 30px;height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.3)}
.chip .nm{font-size:16px;line-height:1.2;color:#ded8cc}
.chip .no{font-size:11.5px;color:#8a8278;font-variant-numeric:tabular-nums}

#stagewrap{flex:1;position:relative;overflow:hidden;background:#0e0c0a;display:flex;align-items:center;justify-content:center}
#stage{position:relative;line-height:0;touch-action:none}
#stage img{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.mk{position:absolute;z-index:3;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:3.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 3px 11px rgba(0,0,0,.65);touch-action:none}
.mk.ghost{z-index:2;width:38px;height:38px;border-style:dashed;border-width:3px;cursor:default;font-size:15px}
.mk.lit{box-shadow:0 0 0 6px rgba(232,197,71,.6),0 3px 11px rgba(0,0,0,.65)}
body.placing .mk{pointer-events:none}

#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(20,18,16,.95);border:1px solid #4a4138;border-radius:12px;padding:14px 26px;font-size:21px;color:#f0e8d8;display:none;pointer-events:none;max-width:82%;text-align:center}
#hint.show{display:block}

.ov{position:fixed;inset:0;background:rgba(8,7,6,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.ov.show{display:flex}
.pane{background:#211c17;border:1px solid #433c33;border-radius:16px;max-width:720px;width:100%;max-height:94vh;overflow-y:auto}
.pane header{background:#211c17;border:0;padding:20px 26px 12px;align-items:flex-start;position:sticky;top:0;z-index:2}
.ttl{display:flex;gap:18px;align-items:center}
.ttl .sw{width:64px;height:64px;border-radius:11px;border:1px solid rgba(255,255,255,.32);flex:0 0 64px}
.ttl h3{margin:0;font-size:28px;font-weight:600;line-height:1.15}
.ttl .frm{margin:5px 0 0;font-size:16px;color:#9c9488;font-family:ui-monospace,Menlo,Consolas,monospace}
.pbody{padding:6px 26px 22px}
.fl{margin-bottom:18px}
.fl label{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:#8a8278;margin-bottom:7px;font-weight:600}
.fl input,.fl textarea{width:100%;font:inherit;font-size:20px;color:#ede8dd;background:#171410;border:1px solid #3c352c;border-radius:10px;padding:13px 14px;user-select:text}
.fl textarea{resize:vertical;min-height:80px;line-height:1.45}
.fl input:focus,.fl textarea:focus{outline:0;border-color:#8a6a14}
.hintxt{font-size:14px;color:#7d756a;margin-top:6px;line-height:1.45}
.coins{display:flex;gap:10px}
.coin{width:58px;height:58px;border-radius:50%;border:2.5px solid #4a4138;background:transparent;cursor:pointer;padding:0;font-size:20px;color:#6b6358;min-height:58px}
.coin.fill{background:#b8902a;border-color:#d9ad3a;color:#241c08;font-weight:700}
.pfoot{display:flex;gap:11px;padding:14px 26px 20px;flex-wrap:wrap;position:sticky;bottom:0;background:#211c17;border-top:1px solid #332e28}
.pfoot .spacer{flex:1}

/* --- corrigé projeté --- */
#rank{max-width:1180px}
#rank .ttl h3{font-size:34px}
#rank .frm{font-size:18px}
.rk{display:flex;align-items:center;gap:16px;width:100%;padding:11px 14px;margin-bottom:8px;background:#262019;border:1px solid #39322a;border-radius:12px;cursor:pointer;text-align:left;min-height:66px}
.rk:hover{background:#2f2820}
.rk .sw{flex:0 0 38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.3)}
.rk .nm{font-size:23px;color:#ece6da;flex:1}
.rk .co{font-size:26px;letter-spacing:3px;white-space:nowrap;color:#d9ad3a}
.rk .co i{color:#4a4138;font-style:normal}
.rk .es{font-size:17px;color:#8a8278;white-space:nowrap;min-width:150px;text-align:right}
.g0{color:#6fbf8a}.g1{color:#d9c05a}.g2{color:#e07a5f;font-weight:600}

#card{max-width:1120px}
#card .ttl h3{font-size:38px}
#card .ttl .sw{width:80px;height:80px;flex:0 0 80px}
#card .ttl .frm{font-size:19px}
.cd{padding:4px 40px 34px}
.cd .meta{font-size:24px;color:#c3bbae;line-height:1.5;margin:0 0 6px}
.cd .meta b{color:#ece6da}
.cd .price{display:flex;align-items:baseline;gap:18px;margin:22px 0 26px;flex-wrap:wrap}
.cd .price .big{font-size:46px;letter-spacing:8px;color:#d9ad3a}
.cd .price .big i{color:#4a4138;font-style:normal}
.cd .price .cmp{font-size:22px;color:#9c9488}
.cd h4{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#8a8278;margin:0 0 8px;font-weight:600}
.cd .sav{font-size:28px;line-height:1.5;color:#ece6da;margin:0 0 26px}
.cd .chk{font-size:25px;line-height:1.45;margin:0;padding:16px 20px;background:#1a1611;border-left:4px solid #8a6a14;border-radius:0 10px 10px 0;color:#ddd5c4}
.cd .chk em{color:#e8c547;font-style:italic}

#fiche{max-width:1120px}
#fiche .ttl h3{font-size:38px}
#fiche .ttl .sw{width:80px;height:80px;flex:0 0 80px}
#fiche .ttl .frm{font-size:19px}
.fb{padding:4px 40px 30px}
.grp{font-size:21px;color:#e8c547;margin:0 0 24px;letter-spacing:.3px}
.fb h4{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#8a8278;margin:0 0 9px;font-weight:600}
.fb .tx{font-size:27px;line-height:1.5;color:#ece6da;margin:0 0 26px;white-space:pre-wrap}
.fb .tx.sm{font-size:19px;color:#b4ab9d}
.fb .est{display:flex;align-items:baseline;gap:18px;margin:0 0 8px;flex-wrap:wrap}
.fb .est .big{font-size:42px;letter-spacing:7px;color:#d9ad3a}
.fb .est .big i{color:#4a4138;font-style:normal}
.fb img.shot{max-width:100%;border-radius:12px;border:1px solid #433c33;margin-bottom:24px}
.sep{border:0;border-top:1px solid #3a342c;margin:30px 0 26px}
.sep+h4{color:#c9a227}
.none{font-size:23px;color:#9c9488;line-height:1.5;margin:10px 0 24px}
.chip{position:relative}
.chip.fiche{border-color:#5d5230}
.chip .bd{position:absolute;top:7px;right:9px;width:11px;height:11px;border-radius:50%;background:#c9a227}
#rail h2 span{float:right;margin-right:6px;color:#c9a227;font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px}
</style>
</head>

</div></div>

<div class="ov" id="ovCard"><div class="pane" id="card">

</div></div>

<script>
const PIG=[
 {id:1,n:"Outremer",f:"Lazurite — Na<sub>8–10</sub>Al<sub>6</sub>Si<sub>6</sub>O<sub>24</sub>S<sub>2–4</sub>",c:"#26418F",p:5,x:77.3,y:41.0,
  lieu:"Mines de Sar-e-Sang, vallée du Kokcha, Badakhshan (Afghanistan)",
  voie:"Caravane jusqu'aux ports du Levant, puis navire vénitien",
  sav:"Broyer 100 g de lapis ne donne que quelques grammes de pigment pur. Vermeer en met partout — y compris dans les ombres et sous les couches visibles, là où personne ne le verra jamais. Un luxe invisible.",
  chk:"Vermeer, <em>L'Art de la peinture</em> — le rideau, la robe."},
 {id:2,n:"Indigo",f:"Indigotine — C<sub>16</sub>H<sub>10</sub>N<sub>2</sub>O<sub>2</sub>",c:"#2B3A5C",p:3,x:80.5,y:47.0,
  lieu:"Java, côte de Coromandel, Bengale",voie:"Mer, par le cap de Bonne-Espérance",
  sav:"D'abord une teinture, ensuite une peinture. Le VOC en apporte tant que le cours s'effondre en Europe — au point de ruiner les producteurs de pastel du Languedoc, qui vendaient jusque-là le seul bleu textile disponible.",
  chk:"Mêlé au noir dans les vêtements sombres des portraits. Couleur fugace : elle pâlit."},
 {id:3,n:"Cochenille",f:"Acide carminique — C<sub>22</sub>H<sub>20</sub>O<sub>13</sub>",c:"#9B1B30",p:5,x:27.5,y:45.2,
  lieu:"Oaxaca, Nouvelle-Espagne (Mexique)",voie:"Mer, par Veracruz, La Havane et Séville",
  sav:"Il faut environ 70 000 insectes séchés pour un kilo de matière. Monopole espagnol strict : les Hollandais l'obtiennent par la prise de navires et par la contrebande.",
  chk:"Velours, tapis et tentures des intérieurs hollandais. Beaucoup de ces rouges ont pâli et sont aujourd'hui bruns."},
 {id:4,n:"Bois de brésil",f:"Brésiline — C<sub>16</sub>H<sub>14</sub>O<sub>5</sub>",c:"#B5462B",p:2,x:44.5,y:55.9,
  lieu:"Pernambouc (Brésil)",voie:"Mer, Atlantique, en vrac comme du fret ordinaire",
  sav:"Le pays a pris le nom du bois, et non l'inverse. La couleur s'extrait par décoction des copeaux — et passe à la lumière en quelques années. Le sucre et la couleur sortent du même navire.",
  chk:"Frans Post, <em>Un moulin à sucre tourné par l'eau</em>."},
 {id:5,n:"Gomme-gutte",f:"Résine de <i>Garcinia</i> — acide gambogique",c:"#E0A010",p:3,x:84.6,y:47.6,
  lieu:"Cambodge et Siam",voie:"Mer, avec les épices du VOC",
  sav:"La résine coule de l'arbre entaillé et durcit en bâtons creux. C'est aussi un purgatif violent : les peintres, qui affinaient leur pinceau entre les lèvres, apprenaient vite à s'en méfier.",
  chk:"Glacis jaunes translucides, feuillages, reflets sur le métal."},
 {id:6,n:"Smalt",f:"Verre de cobalt — CoO·nSiO<sub>2</sub>",c:"#6B7FA8",p:1,x:66.5,y:35.2,
  lieu:"Saxe, monts Métallifères",voie:"Terre, puis Baltique et Hambourg",
  sav:"Le bleu du pauvre — et pourtant, quand Rembrandt utilisait du bleu, c'était presque toujours celui-là. Il se décolore avec le temps : des ciels autrefois bleus sont aujourd'hui gris-brun. Ce que vous voyez au musée n'est pas ce que le peintre a peint.",
  chk:"Ciels de paysages et robes bleues devenues ternes."},
 {id:7,n:"Vermillon",f:"Sulfure de mercure — HgS",c:"#E0301E",p:4,x:65.6,y:34.5,
  lieu:"Fabriqué à Amsterdam ; cinabre d'Almadén (Espagne)",voie:"Mer depuis l'Espagne, puis fabrication sur place",
  sav:"Soufre et mercure chauffés ensemble pendant des mois. Les Hollandais ne se contentent plus de l'importer : ils le produisent et le revendent à l'Europe. Un pigment qui change de camp.",
  chk:"Lèvres, rubans, bas rouges des personnages."},
 {id:8,n:"Jaune de plomb-étain",f:"Pb<sub>2</sub>SnO<sub>4</sub>",c:"#E8C547",p:2,x:65.3,y:34.8,
  lieu:"Fabriqué dans l'atelier même",voie:"Zéro kilomètre — mais l'étain est importé",
  sav:"Plomb et oxyde d'étain cuits ensemble vers 800 °C. La recette disparaît vers 1750 et n'est retrouvée qu'en 1941, par analyse chimique de tableaux anciens. Un savoir-faire perdu pendant deux siècles, restitué par un laboratoire.",
  chk:"Bosch, <em>La Nef des fous</em> — palette réduite à trois couleurs, dont celle-ci."},
 {id:9,n:"Blanc de plomb",f:"Céruse — 2PbCO<sub>3</sub>·Pb(OH)<sub>2</sub>",c:"#F2F0E6",p:1,x:65.0,y:35.1,
  lieu:"Amsterdam et Rotterdam",voie:"Aucune — c'est la Hollande qui l'exporte",
  sav:"Procédé dit « hollandais » : des bandes de plomb enfermées des mois durant dans des pots, avec du vinaigre et du fumier. Toxique — la « colique des peintres » était une maladie professionnelle reconnue. Le seul pigment que la Hollande vend au monde.",
  chk:"Partout. C'est le pigment le plus consommé du siècle, présent dans chaque tableau du cours."},
 {id:10,n:"Garance",f:"Alizarine — C<sub>14</sub>H<sub>8</sub>O<sub>4</sub>",c:"#B04A5A",p:2,x:64.7,y:35.4,

  chk:"Carnations, drapés roses, glacis posés sur les rouges."},
 {id:11,n:"Noir d'ivoire",f:"Carbone + Ca<sub>3</sub>(PO<sub>4</sub>)<sub>2</sub>",c:"#1A1613",p:3,x:65.3,y:50.4,

 {id:12,n:"Terre d'ombre",f:"Fe<sub>2</sub>O<sub>3</sub> + MnO<sub>2</sub> + argile",c:"#6B5540",p:1,x:65.5,y:39.3,

  sav:"Personne ne la cite jamais. C'est pourtant elle qui donne sa « tonalité brune » à l'école de Haarlem — c'est-à-dire la couleur même du paysage hollandais.",
  chk:"Salomon van Ruysdael, <em>Paysage</em> — musée de Grenoble."}];

const FICHES0={"1": {"grp": "Lilie-Rose et Titouan", "ori": "Vallée Kokcha dans la province de Badakhchan en Afganistan", "not": "On l'obtient a partir de lapis lazuli broyé\nOn obtient 3 grammes de pigment avec 100 grammes de lapis lazuli.\nSon nom vient de sa provenance de l'autre côté de la mer méditerranée.", "src": "Wikipedia,", "est": 5, "dt": "16/10/2026"}, "2": {"grp": "Camille le conquérant et lise la gueuse", "ori": "Asie et inde", "not": "Il est extrait de plantes tinctoriales, il est connu depuis l'antiquité en Égypte en Inde et au Pérou, il a etait synthétisé pour la 1ere fois en laboratoire en 1882. Il etait exporté par des routes terrestres et maritimes.", "src": "Google ia, wikipedia", "est": 5, "dt": "16/10/2026"}, "3": {"grp": "Merlin Joachim", "ori": "Mexique (principalement la vallée d'Oaxaca / vice-royauté de Nouvelle-Espagne) Région colonisée par l'Espagne.", "not": "On l'obtient en séchant et en broyant des insectes femelles vivant sur les nopal/figuiers de Barbarie. Il est transporté par les bateaux espagnols à travers l'Atlantique depuis les Amériques jusqu'en Espagne, puis redistribué à la Bourse d'Amsterdam par les marchands hollandais. Son prix extrêmement élevé s'explique par la rareté, la main-d'œuvre nécessaire pour récolter des milliers d'insectes à la main, le monopole commercial espagnol et sa capacité unique à produire des glacis rouges carmin profonds.", "src": "Gemini : source : Rijksmuseum / Mauritshuis (Analyses scientifiques des œuvres de Vermeer et Rembrandt)", "est": 5, "dt": "16/10/2026"}, "10": {"grp": "Anaïs, Léana", "ori": "Voiron", "not": "Pour faire la couleur garance, on utilise la racine de la plante.\nIl faut attendre 3 ans avant la première récolte.\nLa province des Pays-Bas qui en cultivait le plus est la Zélande.", "src": "Google, Encyclopédie univers, Couleur Garance.", "est": 4, "dt": "16/10/2026"}};

const K='pigments-dewit-v1', KR='pigments-dewit-ref', KF='pigments-dewit-fiches';
let S={}, REF={}, FI={}, sel=null, drawing=null, reveal=false;
const $=i=>document.getElementById(i);
const stage=$('stage'), svg=$('svg'), hint=$('hint');
const rx=p=>REF[p.id]?REF[p.id].x:p.x, ry=p=>REF[p.id]?REF[p.id].y:p.y;
const coins=n=>'●'.repeat(n)+'<i>'+'○'.repeat(5-n)+'</i>';

function load(){try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
  try{REF=JSON.parse(localStorage.getItem(KR))||{}}catch(e){REF={}}
  let imp={};try{imp=JSON.parse(localStorage.getItem(KF))||{}}catch(e){imp={}}
  FI=Object.assign({},FICHES0,imp);}
function saveFi(){const imp={};for(const k in FI){
    if(JSON.stringify(FI[k])!==JSON.stringify(FICHES0[k]))imp[k]=FI[k]}
  try{localStorage.setItem(KF,JSON.stringify(imp))}catch(e){alert("La fiche est trop lourde pour être conservée (capture d'écran). Elle s'affiche, mais disparaîtra au rechargement.")}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function saveRef(){try{localStorage.setItem(KR,JSON.stringify(REF))}catch(e){}}
function st(id){return S[id]||(S[id]={})}
function dark(h){const r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
  return (r*299+g*587+b*114)/1000>140?'#141210':'#fff'}
function say(t){hint.innerHTML=t;hint.classList.toggle('show',!!t)}

function chips(){
  $('chips').innerHTML=PIG.map(p=>`<button class="chip${S[p.id]&&S[p.id].x!=null?' done':''}${FI[p.id]?' fiche':''}" data-id="${p.id}">
    <span class="sw" style="background:${p.c}"></span>
    <span><span class="no">${String(p.id).padStart(2,'0')}</span><br><span class="nm">${p.n}</span></span>
    ${FI[p.id]?'<span class="bd"></span>':''}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>pick(+b.dataset.id));
  $('prog').innerHTML=`<b>${PIG.filter(p=>S[p.id]&&S[p.id].x!=null).length}</b> / 12 posés`;
  const nf=Object.keys(FI).length;
  $('rail').querySelector('h2').innerHTML='Pigments'+(nf?`<span>${nf} fiche${nf>1?'s':''}</span>`:'');
}
function pick(id){
  const s=S[id];
  if(FI[id]){openFiche(id);return}
  if(s&&s.x!=null){reveal?openCard(id):openForm(id);return}
  sel=sel===id?null:id;
  document.body.classList.toggle('placing',!!sel);
  chips();
  if(sel){document.querySelector(`.chip[data-id="${sel}"]`).classList.add('sel');
    say(`<b>${PIG.find(p=>p.id===sel).n}</b> — touchez la carte à l'endroit de production`)}
  else say('');
}

function render(){
  stage.querySelectorAll('.mk').forEach(e=>e.remove());
  let paths='';
  PIG.forEach(p=>{
    const s=S[p.id]; if(!s||s.x==null)return;
    if(s.rt&&s.rt.length>1)
      paths+=`<path d="${s.rt.map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join(' ')}" fill="none" stroke="${p.c}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".92"/>`;
    const m=document.createElement('div');
    m.className='mk'+(drawing===p.id?' lit':'');
    m.style.cssText=`left:${s.x}%;top:${s.y}%;background:${p.c};color:${dark(p.c)}`;
    m.textContent=p.id; m.dataset.id=p.id; m.title=p.n;
    stage.appendChild(m); grab(m,p.id);
  });
  if(reveal){
    const cl=[];
    PIG.forEach(p=>{
      const bx=rx(p), by=ry(p);
      let g=cl.find(c=>Math.hypot(c.x-bx,(c.y-by)*.84)<3.0);
      if(!g){g={x:bx,y:by,m:[]};cl.push(g)}
      g.m.push({p,bx,by});
    });
    cl.forEach(c=>{
      const n=c.m.length, R=n>1?4.0:0;
      c.m.forEach((it,k)=>{
        const a=-Math.PI/2+k*(2*Math.PI/n);
        const gx=it.bx+R*Math.cos(a), gy=it.by+R*Math.sin(a)*1.19;
        const g=document.createElement('div');
        g.className='mk ghost';
        g.style.cssText=`left:${gx}%;top:${gy}%;background:${it.p.c};color:${dark(it.p.c)}`;
        g.textContent=it.p.id; g.title=it.p.n+' — '+it.p.lieu+'  (glissez pour ajuster)';
        stage.appendChild(g); dragRef(g,it.p,gx-it.bx,gy-it.by);
        if(R)paths+=`<path d="M${it.bx} ${it.by} L${gx} ${gy}" stroke="#fff" stroke-width="1.6" opacity=".75" vector-effect="non-scaling-stroke"/>`;
      });
      if(n>1)paths+=`<circle cx="${c.x}" cy="${c.y}" r=".6" fill="#fff" opacity=".9"/>`;
    });
  }
  svg.innerHTML=paths;
}

function rel(e){
  const r=stage.getBoundingClientRect();
  return{x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),
         y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};
}
function grab(el,id){
  let moved=false,t0=0;
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation(); if(drawing)return;
    moved=false;t0=Date.now();el.setPointerCapture(e.pointerId);
    const mv=ev=>{moved=true;const q=rel(ev);st(id).x=q.x;st(id).y=q.y;
      el.style.left=q.x+'%';el.style.top=q.y+'%'};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);
      if(moved){save();render()}else if(Date.now()-t0<700){FI[id]?openFiche(id):(reveal?openCard(id):openForm(id))}};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
  });
}
function dragRef(el,p,ox,oy){
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation(); el.setPointerCapture(e.pointerId);
    const mv=ev=>{const q=rel(ev);REF[p.id]={x:+(q.x-ox).toFixed(2),y:+(q.y-oy).toFixed(2)};
      el.style.left=q.x+'%';el.style.top=q.y+'%'};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);saveRef();render()};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
  });
}
stage.addEventListener('pointerdown',e=>{
  const q=rel(e);
  if(drawing){const s=st(drawing);(s.rt=s.rt||[]).push(q);save();render();
    say(`<b>${s.rt.length}</b> point${s.rt.length>1?'s':''} — continuez, ou <b>Entrée</b> pour terminer`);return}
  if(sel){const s=st(sel);s.x=q.x;s.y=q.y;const id=sel;sel=null;
    document.body.classList.remove('placing');chips();render();save();say('');openForm(id)}
});

let cur=null;
function openForm(id){
  cur=id; const p=PIG.find(x=>x.id===id), s=st(id);
  $('fSw').style.background=p.c; $('fNm').textContent=p.n; $('fFrm').innerHTML=p.f;
  $('fOri').value=s.ori||''; $('fNot').value=s.not||''; $('fSrc').value=s.src||'';
  $('fCoins').innerHTML=[1,2,3,4,5].map(i=>`<button class="coin${(s.est||0)>=i?' fill':''}" data-v="${i}">${i}</button>`).join('');
  $('fCoins').querySelectorAll('.coin').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v; st(id).est=v; sync(); save();
    $('fCoins').querySelectorAll('.coin').forEach(c=>c.classList.toggle('fill',+c.dataset.v<=v));
  });
  $('ovForm').classList.add('show');
}
function sync(){if(!cur)return;const s=st(cur);
  s.ori=$('fOri').value;s.not=$('fNot').value;s.src=$('fSrc').value}
['fOri','fNot','fSrc'].forEach(k=>$(k).addEventListener('input',()=>{sync();save()}));
function closeForm(){if(cur){sync();save()}$('ovForm').classList.remove('show');cur=null;render()}
$('fOk').onclick=closeForm;
$('fDel').onclick=()=>{if(cur&&confirm('Retirer ce pigment de la carte ?')){delete S[cur];save();$('ovForm').classList.remove('show');cur=null;chips();render()}};
$('fClr').onclick=()=>{if(cur){delete st(cur).rt;save();render()}};
$('fRoute').onclick=()=>{
  if(!cur)return; const id=cur, s=st(id);
  $('fOri').blur(); closeForm(); drawing=id; s.rt=[{x:s.x,y:s.y}]; save();
  document.body.classList.add('placing'); render();
  say(`Touchez la carte pour poser les étapes — <b>Entrée</b> ou double-clic pour terminer`);
  const end=()=>{drawing=null;say('');document.body.classList.remove('placing');render();
    document.removeEventListener('keydown',kd);stage.removeEventListener('dblclick',end);openForm(id)};
  const kd=e=>{if(e.key==='Enter'||e.key==='Escape')end()};
  document.addEventListener('keydown',kd); stage.addEventListener('dblclick',end);
};

/* ---------- fiche d'un groupe ---------- */
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
let gcur=null;
function openFiche(id){
  gcur=id; const p=PIG.find(x=>x.id===id), f=FI[id]||{}, s=S[id]||{};
  $('gSw').style.background=p.c; $('gNm').textContent=p.n; $('gFrm').innerHTML=p.f;
  let h='';
  if(!FI[id]){
    h+=`<p class="none">Aucune fiche reçue pour ce pigment.<br>Utilisez « Fiches… » pour en déposer une, ou saisissez directement au tableau.</p>`;
  }else{
    h+=`<p class="grp">Fiche de ${esc(f.grp||'—')}${f.dt?' · '+esc(f.dt):''}</p>`;
    if(f.ori)h+=`<h4>Lieu d'origine</h4><p class="tx">${esc(f.ori)}</p>`;
    if(f.not)h+=`<h4>Ce qu'ils ont trouvé</h4><p class="tx">${esc(f.not)}</p>`;
    if(f.src)h+=`<h4>Source utilisée</h4><p class="tx sm">${esc(f.src)}</p>`;
    if(f.est)h+=`<h4>Leur estimation</h4><div class="est"><span class="big">${coins(f.est)}</span></div>`;
    if(f.img)h+=`<h4 style="margin-top:26px">Fiche telle qu'ils l'ont envoyée</h4><img class="shot" src="${f.img}" alt="Fiche envoyée en image">`;
  }
  if(reveal){
    h+=`<hr class="sep"><h4>Prix réel</h4><div class="est"><span class="big">${coins(p.p)}</span>`;
    h+=`<span class="tx sm" style="margin:0">${esc(p.lieu)}</span></div>`;
    h+=`<h4 style="margin-top:22px">À savoir</h4><p class="tx">${esc(p.sav)}</p>`;
    h+=`<h4>Cherchez-le dans</h4><p class="tx sm">${p.chk}</p>`;
  }
  $('gBody').innerHTML=h;
  $('gPlace').textContent = s.x!=null ? 'Déplacer la pastille' : 'Poser la pastille';
  $('gPrix').textContent = reveal ? 'Masquer le prix réel' : 'Révéler le prix réel';
  $('gPrix').classList.toggle('on',reveal);
  $('gRoute').style.display = s.x!=null ? '' : 'none';
  $('ovFiche').classList.add('show');
}
function closeFiche(){$('ovFiche').classList.remove('show')}
$('gClose').onclick=closeFiche;
$('gEdit').onclick=()=>{const id=gcur;closeFiche();openForm(id)};
$('gPlace').onclick=()=>{
  const id=gcur; closeFiche();
  if(S[id]&&S[id].x!=null){delete S[id].x;delete S[id].y;save();render()}
  sel=id; document.body.classList.add('placing'); chips();
  const c=document.querySelector(`.chip[data-id="${id}"]`); if(c)c.classList.add('sel');
  say(`<b>${PIG.find(p=>p.id===id).n}</b> — touchez la carte à l'endroit de production`);
};
$('gRoute').onclick=()=>{const id=gcur;closeFiche();openForm(id);$('fRoute').click()};
$('gPrix').onclick=()=>{
  reveal=!reveal; $('bReveal').classList.toggle('on',reveal); render();
  if(!reveal){$('ovRank').classList.remove('show');$('ovCard').classList.remove('show')}
  openFiche(gcur);
};
addEventListener('keydown',e=>{
  if(!$('ovFiche').classList.contains('show')||!gcur)return;
  const i=PIG.findIndex(p=>p.id===gcur);
  if(e.key==='ArrowRight')openFiche(PIG[(i+1)%PIG.length].id);
  if(e.key==='ArrowLeft')openFiche(PIG[(i-1+PIG.length)%PIG.length].id);
  if(e.key==='Escape')closeFiche();
});

/* ---------- import des fiches PDF ou image ---------- */
const WIN={0x92:'’',0x91:'‘',0x93:'“',0x94:'”',0x97:'—',0x96:'–',0x85:'…',0x95:'•',0x80:'€',0x9C:'œ',0x8C:'Œ'};
function deWin(t){let o='';for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);o+=WIN[c]||String.fromCharCode(c)}return o}
const LBL=['GROUPE',"LIEU D'ORIGINE",'CE QUE NOUS AVONS APPRIS','SOURCE UTILISÉE','NOTRE ESTIMATION DU PRIX'];
function joinPara(lines){
  if(!lines.length)return '';
  const mx=Math.max(...lines.map(l=>l.length));
  let out='',buf='';
  lines.forEach((l,i)=>{
    buf=buf?buf+' '+l:l;
    if(l.length<mx*0.82||i===lines.length-1){out+=(out?'\n':'')+buf;buf=''}
  });
  return out;
}
function parsePDF(buf){
  let raw='';const u=new Uint8Array(buf);
  for(let i=0;i<u.length;i++)raw+=String.fromCharCode(u[i]);
  const m=raw.indexOf('stream'), e=raw.lastIndexOf('endstream');
  if(m<0||e<0)return null;
  const body=raw.slice(m+6,e);
  const out=[]; const re=/\(((?:\\.|[^\\()])*)\)\s*Tj/g; let g;
  while((g=re.exec(body))!==null)
    out.push(deWin(g[1].replace(/\\([\\()])/g,'$1')));
  if(out.length<6)return null;
  let id=null;
  for(const t of out){const k=t.match(/Pigment n°\s*(\d+)/);if(k){id=+k[1];break}}
  if(!id)return null;
  const f={};let cur=null,bucket=[];
  const flush=()=>{if(!cur)return;
    const v=joinPara(bucket);
    if(cur==='GROUPE')f.grp=v;
    else if(cur==="LIEU D'ORIGINE")f.ori=v;
    else if(cur==='CE QUE NOUS AVONS APPRIS')f.not=v;
    else if(cur==='SOURCE UTILISÉE')f.src=v;
    else if(cur==='NOTRE ESTIMATION DU PRIX'){const k=v.match(/(\d)\s*sur\s*5/);if(k)f.est=+k[1]}
    bucket=[]};
  for(const t of out){
    const T=t.trim();
    if(LBL.includes(T)){flush();cur=T;continue}
    if(/^1 = pigment de mis/.test(T)){flush();cur=null;continue}
    if(cur)bucket.push(T);
    else{const d=T.match(/(\d{2}\/\d{2}\/\d{4})/);if(d)f.dt=d[1]}
  }
  flush();
  if(f.est===undefined)delete f.est;
  return (f.grp||f.ori||f.not)?{id,f}:null;
}
function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();
      im.onload=()=>{const k=Math.min(1,1300/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=im.width*k|0; c.height=im.height*k|0;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.78))};
      im.onerror=()=>res(null); im.src=r.result};
    r.onerror=()=>res(null); r.readAsDataURL(file);
  });
}
$('bFich').onclick=()=>$('fIn').click();
$('fIn').onchange=async e=>{
  const files=[...e.target.files]; e.target.value='';
  let ok=0, img=0; const bad=[];
  for(const file of files){
    if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){
      const r=parsePDF(await file.arrayBuffer());
      if(r){FI[r.id]=r.f; ok++} else bad.push(file.name);
    }else if(/^image\//.test(file.type)){
      const m=file.name.match(/^(\d{1,2})\s*[-_]/);
      const d=await shrink(file);
      if(!d){bad.push(file.name);continue}
      let id=m?+m[1]:null;
      if(!id){const a=prompt(`Numéro du pigment pour « ${file.name} » ? (1 à 12)`);id=+a}
      if(id>=1&&id<=12){FI[id]=Object.assign({},FI[id],{img:d,grp:(FI[id]&&FI[id].grp)||'fiche en image'});ok++;img++}
      else bad.push(file.name);
    }else bad.push(file.name);
  }
  saveFi(); chips(); 
  let msg=`${ok} fiche${ok>1?'s':''} intégrée${ok>1?'s':''}`+(img?` (dont ${img} en image)`:'');
  if(bad.length)msg+=`\n\nNon reconnu${bad.length>1?'s':''} :\n`+bad.join('\n')+`\n\nLes PDF doivent venir de la page « Ma fiche pigment ». Pour une image, nommez le fichier en commençant par le numéro du pigment (ex. 07-vermillon.png).`;
  alert(msg);
};

/* ---------- corrigé projeté ---------- */
let order=[];
function openRank(){
  order=[...PIG].sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n));
  let ok=0,sum=0;
  $('rows').innerHTML=order.map(p=>{
    const s=S[p.id]||{}, e=s.est||0, d=e?Math.abs(e-p.p):null;
    if(d===0)ok++; if(d!=null)sum++;
    const cls=d===null?'':d===0?'g0':d===1?'g1':'g2';
    const cmp=e?`<span class="${cls}">ils avaient ${'●'.repeat(e)}</span>`:'non estimé';
    return `<button class="rk" data-id="${p.id}"><span class="sw" style="background:${p.c}"></span>
      <span class="nm">${p.n}</span><span class="co">${coins(p.p)}</span><span class="es">${cmp}</span></button>`}).join('');
  $('rows').querySelectorAll('.rk').forEach(b=>b.onclick=()=>{$('ovRank').classList.remove('show');openCard(+b.dataset.id)});
  $('score').textContent=sum?`${ok} estimation${ok>1?'s':''} exacte${ok>1?'s':''} sur ${sum} — touchez une ligne pour la fiche complète`
    :`Touchez une ligne pour afficher la fiche complète`;
  $('ovRank').classList.add('show');
}
function openCard(id){
  const p=PIG.find(x=>x.id===id), s=S[id]||{};
  $('cSw').style.background=p.c; $('cNm').textContent=p.n; $('cFrm').innerHTML=p.f;
  $('cMeta').innerHTML=`<b>${p.lieu}</b><br>${p.voie}`;
  $('cCo').innerHTML=coins(p.p);
  $('cCmp').innerHTML=s.est?`la classe avait estimé ${'●'.repeat(s.est)}`
    +(s.ori?` &nbsp;·&nbsp; « ${s.ori} »`:''):'';
  $('cSav').textContent=p.sav; $('cChk').innerHTML=p.chk;
  cur=null; $('ovCard').dataset.id=id; $('ovCard').classList.add('show');
}
function step(d){
  if(!order.length)order=[...PIG].sort((a,b)=>b.p-a.p||a.n.localeCompare(b.n));
  const i=order.findIndex(p=>p.id===+$('ovCard').dataset.id);
  openCard(order[(i+d+order.length)%order.length].id);
}
$('cPrev').onclick=()=>step(-1); $('cNext').onclick=()=>step(1);
$('cClose').onclick=()=>{$('ovCard').classList.remove('show');openRank()};
$('rClose').onclick=()=>$('ovRank').classList.remove('show');
$('rRef').onclick=()=>{if(confirm('Annuler vos ajustements de repères ?')){REF={};saveRef();render()}};
addEventListener('keydown',e=>{if($('ovCard').classList.contains('show')){
  if(e.key==='ArrowRight')step(1); if(e.key==='ArrowLeft')step(-1);}});

$('bReveal').onclick=()=>{
  reveal=!reveal; $('bReveal').classList.toggle('on',reveal); render();
  if($('ovFiche').classList.contains('show')&&gcur){openFiche(gcur);return}
  if(reveal)openRank(); else{$('ovRank').classList.remove('show');$('ovCard').classList.remove('show')}
};
$('bReset').onclick=()=>{if(confirm('Tout effacer ? Le travail de la classe sera perdu.')){S={};save();reveal=false;$('bReveal').classList.remove('on');sel=null;document.body.classList.remove('placing');chips();render()}};

$('bJson').onclick=()=>{
  const out={carte:"Frederik de Wit, Nova Orbis Tabula, 1662",date:new Date().toISOString().slice(0,10),
    pigments:PIG.map(p=>{const s=S[p.id]||{};return{id:p.id,nom:p.n,place:s.x!=null,
      x:s.x!=null?+s.x.toFixed(2):null,y:s.y!=null?+s.y.toFixed(2):null,
      origine_eleve:s.ori||"",notes:s.not||"",source:s.src||"",
      prix_estime:s.est||null,prix_reel:p.p,origine_reelle:p.lieu,
      route:(s.rt||[]).map(q=>({x:+q.x.toFixed(2),y:+q.y.toFixed(2)}))}})};
  dl(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),'route-des-pigments.json');
};
$('bPng').onclick=()=>{
  const img=$('map'), c=document.createElement('canvas');
  c.width=img.naturalWidth; c.height=img.naturalHeight;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  const W=c.width,H=c.height;
  PIG.forEach(p=>{const s=S[p.id];if(!s||s.x==null)return;
    if(s.rt&&s.rt.length>1){g.beginPath();s.rt.forEach((q,i)=>g[i?'lineTo':'moveTo'](q.x/100*W,q.y/100*H));
      g.strokeStyle=p.c;g.lineWidth=5;g.lineJoin='round';g.lineCap='round';g.stroke()}
    const x=s.x/100*W,y=s.y/100*H;
    g.beginPath();g.arc(x,y,22,0,7);g.fillStyle=p.c;g.fill();
    g.lineWidth=4;g.strokeStyle='#fff';g.stroke();
    g.fillStyle=dark(p.c);g.font='bold 21px sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillText(p.id,x,y+1)});
  c.toBlob(b=>dl(b,'route-des-pigments.png'));
};
